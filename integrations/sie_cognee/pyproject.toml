[project]
name = "sie-cognee"
version = "0.11.0"
description = "SIE inference and source evidence helpers for Cognee"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "sie-sdk>=0.11.0",
    "cognee==1.6.7",
    "litellm>=1.108.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sie_cognee"]

[settings]
experimental = true
# Every tool below is pinned to an exact version, so mise never needs a remote
# version list. Without this, `mise install` with the tools already installed
# still lists versions from GitHub and other registries whenever its cache
# directory is empty, which is how CI restores it, and a slow API fails the
# job. Missing tools still download as before.
prefer_offline = true

[tools]
python = "3.12.12"
# 0.5.31 is the workspace's uv. 0.9.28 reads the Docker-pinned bundle locks
# (tools/ci/bundle_lock.py); listing it here keeps it in the CI tool cache.
uv = ["0.5.31", "0.9.28"]
rust = { version = "1.98.1", profile = "default", components = ["rustfmt", "clippy", "llvm-tools"] }
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-llvm-cov" = "0.8.7"
node = ["24.12.0", "22.23.2"]
pnpm = "9.15.9"
helm = "3.16.4"
zig = "0.13.0"
"github:nats-io/nats-server" = "2.11.8"
"github:rhysd/actionlint" = "1.7.7"

[env]
UV_CACHE_DIR = "{{env.HOME}}/.cache/sie/uv"
XDG_CACHE_HOME = "{{env.HOME}}/.cache/sie/xdg-cache"

[task_config]
includes = ["tools/mise_tasks"]

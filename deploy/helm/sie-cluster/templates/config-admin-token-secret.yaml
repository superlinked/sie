{{- if and .Values.config.enabled (not .Values.config.auth.adminTokenSecretName) .Values.config.auth.generateAdminToken }}
{{- $name := include "sie-cluster.config.generatedAdminTokenSecretName" . }}
{{- $key := .Values.config.auth.adminTokenSecretKey }}
{{- $token := randAlphaNum 64 | b64enc }}
{{- with lookup "v1" "Secret" (include "sie-cluster.namespace" .) $name }}
{{- with index (.data | default dict) $key }}
{{- $token = . }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "sie-cluster.namespace" . }}
  labels:
    {{- include "sie-cluster.config.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key | quote }}: {{ $token | quote }}
{{- end }}

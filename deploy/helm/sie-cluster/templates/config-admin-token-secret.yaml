{{- if and .Values.config.enabled (include "sie-cluster.config.generatesAdminToken" .) }}
{{- $name := include "sie-cluster.config.generatedAdminTokenSecretName" . }}
{{- $key := include "sie-cluster.config.adminTokenSecretKey" . }}
{{- $token := randAlphaNum 64 | b64enc }}
{{- with lookup "v1" "Secret" (include "sie-cluster.namespace" .) $name }}
{{- $existing := index (.data | default dict) $key | default "" }}
{{- include "sie-cluster.config.validateReusedAdminToken" (dict "name" $name "key" $key "data" $existing) }}
{{- $token = $existing }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "sie-cluster.namespace" . }}
  labels:
    {{- include "sie-cluster.config.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key | quote }}: {{ $token | quote }}
{{- end }}

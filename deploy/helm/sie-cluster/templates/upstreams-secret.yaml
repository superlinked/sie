{{- if eq (include "sie-cluster.upstreams.delivered" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sie-cluster.upstreams.secretName" . }}
  namespace: {{ include "sie-cluster.namespace" . }}
  labels:
    {{- include "sie-cluster.worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  upstreams.yaml: |
    {{- include "sie-cluster.upstreams.file" . | nindent 4 }}
{{- end }}

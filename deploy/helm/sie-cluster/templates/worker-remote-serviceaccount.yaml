{{- if eq (include "sie-cluster.worker.remoteLaneEnabled" .) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sie-cluster.worker.remoteServiceAccountName" . }}
  namespace: {{ include "sie-cluster.namespace" . }}
  labels:
    {{- include "sie-cluster.worker.labels" . | nindent 4 }}
  {{- with dig "remote" "serviceAccount" "annotations" dict .Values.workers }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

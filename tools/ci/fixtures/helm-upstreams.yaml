# Helm `upstreams` values, and the server upstreams file the chart must render
# from them. tools/ci/tests/test_helm_render.py renders `values` and compares
# the result with `rendered`; tools/ci/tests/test_helm_upstreams_contract.py
# loads `rendered` with the server's own parser and requires it to use every
# upstream field the server defines.
values:
  team-sie:
    kind: sie
    base_url: https://sie.example.internal/
    api_key_secret:
      name: team-sie-upstream
      key: api-key
    proxy_url: http://proxy.example.internal:3128
    breaker: {failures: 3, window_s: 12.5, cooldown_s: 45}
    rate_cap:
      requests_per_minute: 600
      max_concurrency: 32
  open-host:
    kind: openai
    base_url: https://host.example.com/v1
    rate_cap:
      requests_per_minute: 300
      max_concurrency: 16
    endpoints: [embeddings, rerank]
    set_params:
      provider: {data_collection: deny}
    strip_params: [user]
    equivalence:
      max_age_s: 300
      record_files: {local/model: /proofs/local-model.json}
rendered:
  upstreams:
    team-sie:
      kind: sie
      base_url: https://sie.example.internal/
      api_key_secret: SIE_UPSTREAM_KEY_TEAM_SIE
      proxy_url: http://proxy.example.internal:3128
      breaker: {failures: 3, window_s: 12.5, cooldown_s: 45}
      rate_cap:
        requests_per_minute: 600
        max_concurrency: 32
    open-host:
      kind: openai
      base_url: https://host.example.com/v1
      rate_cap:
        requests_per_minute: 300
        max_concurrency: 16
      endpoints: [embeddings, rerank]
      set_params:
        provider: {data_collection: deny}
      strip_params: [user]
      equivalence:
        max_age_s: 300
        record_files: {local/model: /proofs/local-model.json}
# URLs the chart and the server must judge alike: `tls: true` checks a
# base_url, which needs https outside loopback, and `tls: false` a proxy_url.
# tools/ci/tests/test_helm_render.py renders each one, and
# tools/ci/tests/test_helm_upstreams_contract.py passes each one to the
# server's validate_upstream_url.
urls:
  - {url: "https://sie.example.internal", tls: true, accepted: true}
  - {url: "https://sie.example.internal:8443/v1", tls: true, accepted: true}
  - {url: "https://sie.example.internal:65535", tls: true, accepted: true}
  - {url: "https://sie.example.internal:0443", tls: true, accepted: true}
  - {url: "https://12345", tls: true, accepted: true}
  - {url: "https://[2001:db8::1]:9443", tls: true, accepted: true}
  - {url: "http://127.0.0.1:9000", tls: true, accepted: true}
  - {url: "http://127.255.255.255", tls: true, accepted: true}
  - {url: "http://LOCALHOST:8080", tls: true, accepted: true}
  - {url: "http://[::1]:8080", tls: true, accepted: true}
  - {url: "https://sie.example.internal:65536", tls: true, accepted: false}
  - {url: "https://sie.example.internal:99999", tls: true, accepted: false}
  - {url: "https://[::1]:99999", tls: true, accepted: false}
  - {url: "https://sie.example.internal:443:1", tls: true, accepted: false}
  - {url: "https://%73ie.example.internal", tls: true, accepted: false}
  - {url: "https://[fe80::1%25eth0]", tls: true, accepted: false}
  - {url: "https://:443/v1", tls: true, accepted: false}
  - {url: "https:///v1", tls: true, accepted: false}
  - {url: "http://127.999.999.999:8080", tls: true, accepted: false}
  - {url: "http://127.000.000.001", tls: true, accepted: false}
  - {url: "https://256.0.0.1", tls: true, accepted: false}
  - {url: "http://127.1", tls: true, accepted: false}
  - {url: "http://sie.example.internal", tls: true, accepted: false}
  - {url: "https://user@sie.example.internal", tls: true, accepted: false}
  - {url: "https://sie.example.internal/v1?x=1", tls: true, accepted: false}
  - {url: "ftp://sie.example.internal", tls: true, accepted: false}
  - {url: "http://proxy.example.internal:3128", tls: false, accepted: true}
  - {url: "http://proxy.example.internal:99999", tls: false, accepted: false}
  - {url: "http://%70roxy.example.internal", tls: false, accepted: false}
  - {url: "http://:3128", tls: false, accepted: false}
# Upstream definitions the chart and the server must judge alike, merged over
# `base_url: https://host.example.com/v1` and a rate cap. The same two tests
# check them.

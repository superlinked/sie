  - {accepted: false, upstream: {kind: openai, endpoints: [chat], set_params: {user: x}, strip_params: [user]}}

  - {accepted: true, upstream: {kind: sie, breaker: {failures: 3, window_s: 12.5, cooldown_s: 45}}}
  - {accepted: true, upstream: {kind: sie, breaker: {}}}
  - {accepted: true, upstream: {kind: sie, breaker: {window_s: 0.5}}}
  - {accepted: false, upstream: {kind: sie, breaker: null}}

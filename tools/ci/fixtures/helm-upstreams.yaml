  - {accepted: false, upstream: {kind: openai}}
  - {accepted: false, upstream: {kind: openai, endpoints: []}}
  - {accepted: false, upstream: {kind: openai, endpoints: [chat, chat]}}
  - {accepted: false, upstream: {kind: openai, endpoints: [images]}}
  - {accepted: false, upstream: {kind: sie, endpoints: [chat]}}
  - {accepted: false, upstream: {kind: sie, set_params: {temperature: 0}}}

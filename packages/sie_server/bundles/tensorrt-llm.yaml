name: tensorrt-llm
priority: 20
default: false
# Reusable direct-HF encoder-decoder runtime. This is a CUDA 13 engine lane,
# not a checkpoint-specific bundle; compatible T5/BART/mBART-family profiles
# opt in through the generic adapter module below.
platform: cuda13
adapters:
- sie_server.adapters.tensorrt_llm.generation
deps:
  # Exact prerelease qualified from tag commit
  # 1cef02e901be43081b1ba6d4981e94ed3bd9c1e8. Compatibility overlays verify
  # the complete rc24 source files they patch and refuse any other build.
  tensorrt-llm: '==1.3.0rc24'
  # rc24's direct-HF T5 closure. Torch resolves to the +cu130 wheel through
  # Dockerfile.cuda13's explicit PyTorch index.
  torch: '==2.11.0'
  transformers: '==5.5.4'
  flashinfer-python: '==0.6.16'
  triton: '==3.6.0'
  nvidia-cutlass-dsl: '==4.5.0'
  nvidia-cuda-tileiras: '==13.1.80'
  nvidia-matmul-heuristics: '==0.1.0.27'
  # cuda-python 13.3.1 permits cuda-pathfinder~=1.1, while cuda-core and
  # cuda-bindings only require >=1.4.2. Pin the import-proven rc24 closure so
  # a newer transitive release cannot silently change the engine image.
  cuda-pathfinder: '==1.7.0'
  # rc24 permits an NCCL range; lock the import-proven cu13 build so PyPI and
  # the cu130 indexes cannot choose a different ABI-compatible-looking wheel.
  nvidia-nccl-cu13: '==2.28.9'
  flash-attn-4: '==4.0.0b11'
  torch-c-dlpack-ext: '==0.1.3'
  xgrammar: '==0.1.32'
  apache-tvm-ffi: '==0.1.6'
  # The published rc24 closure leaves mpmath open; a newer resolution breaks
  # native import. 1.3.0 is the exact import-proven value.
  mpmath: '==1.3.0'

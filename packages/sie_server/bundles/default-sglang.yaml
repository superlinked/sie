name: default-sglang
# Composite bundle: an SGLang-served LLM and the default encoders on the same
# GPU, in one pool lane. The image carries each component bundle's saved
# dependency overlay under /app/bundle-libs.d/<component>, and the worker
# container runs one `sie-server serve` process per component, each in its own
# environment (the default encoders keep transformers 4.57.6; SGLang keeps the
# engine's own transformers 5 closure for chat templates and grammar). One
# worker-sidecar fronts every component process: it batches encoder work in its
# scheduler and passes each generation request through to SGLang's continuous
# batching.
#
# Lowest preference: the gateway never picks this bundle by priority. It routes
# here only when a request's own bundle (default or sglang) has no lane on the
# requested queue pool and machine profile, and this composite does.
priority: 90
default: false
# Ordered component bundles. Each must be an ordinary (non-composite) bundle on
# the same platform. A composite declares no deps of its own: each component
# process uses that component's saved lock.
components:
- default
- sglang
# The union of the component adapter lists, kept explicit so every bundle
# reader (gateway, sie-config, worker, SDK) treats this as an ordinary bundle.
# When you add an adapter to default.yaml or sglang.yaml, add it here too;
# tests/test_composite_bundles.py names any module that is missing.
adapters:
- sie_server.adapters.bert_flash
- sie_server.adapters.bert_flash_cross_encoder
- sie_server.adapters.bge_m3_flag
- sie_server.adapters.bge_m3_flash

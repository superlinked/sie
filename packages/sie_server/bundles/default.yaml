name: default
priority: 10
default: true
adapters:
- sie_server.adapters.bert_flash
- sie_server.adapters.bert_flash_cross_encoder
- sie_server.adapters.bge_m3_flag
- sie_server.adapters.bge_m3_flash
- sie_server.adapters.clip
- sie_server.adapters.colbert
- sie_server.adapters.colbert_modernbert_flash.adapter
- sie_server.adapters.colbert_rotary_flash
- sie_server.adapters.colpali
- sie_server.adapters.colqwen2
- sie_server.adapters.colqwen3
- sie_server.adapters.colsmol
- sie_server.adapters.grounding_dino.adapter
- sie_server.adapters.gte_sparse_flash
- sie_server.adapters.jina_flash_cross_encoder
- sie_server.adapters.modernbert_flash
- sie_server.adapters.modernbert_flash_cross_encoder
- sie_server.adapters.nemo_colembed
- sie_server.adapters.nomic_flash
- sie_server.adapters.owlv2.adapter
- sie_server.adapters.pytorch_embedding
- sie_server.adapters.qwen2_flash
- sie_server.adapters.qwen2_flash_cross_encoder.adapter
- sie_server.adapters.qwen3_vl_embedding
- sie_server.adapters.qwen3_vl_reranker.adapter
- sie_server.adapters.rope_flash
- sie_server.adapters.sentence_transformer
- sie_server.adapters.siglip.adapter
- sie_server.adapters.splade_flash.adapter
- sie_server.adapters.stablebridge_pruner
- sie_server.adapters.whisper.adapter
- sie_server.adapters.xlm_roberta_flash
- sie_server.adapters.nli_classification
- sie_server.adapters.nli_classification_flash
- sie_server.adapters.gliner
- sie_server.adapters.gliner2.adapter
- sie_server.adapters.gliner_bi
- sie_server.adapters.glirel
- sie_server.adapters.gliclass
- sie_server.adapters.laya.adapter
- sie_server.adapters.gliformer.adapter
- sie_server.adapters.donut
- sie_server.adapters.florence2
- sie_server.adapters.docling.adapter
- sie_server.adapters.paddleocr_vl
- sie_server.adapters.mineru_vl
deps:
  # Most flash adapters; sentence_transformer needs >=4.57
  transformers: '>=4.57,<5'
  # Pin torch — flash-attn's unpinned torch dep can pull in 2.10+ which breaks torchvision
  torch: '>=2.9,<2.10'
  # bge_m3, bge_m3_flash, nemo_colembed, nomic_flash, xlm_roberta_flash
  huggingface-hub: '>=0.20'
  # colbert_rotary_flash, jina_flash_cross_encoder
  einops: '>=0.8'
  # sentence_transformer
  sentence-transformers: '>=5.0,<6'
  # bge_m3_flag
  FlagEmbedding: '>=1.3'
  # grounding_dino. EXACT, not a range. `uv run --with-requirements` resolves the
  # overlay live from PyPI, and `--frozen`/`--no-sync` govern only the project
  # env, so any unbounded range here is re-resolved on every eval. The old
  # `>=11,<12` (94430893c) was accidentally stable because the 11.x line is
  # closed, but it contradicted sie-server's own `pillow>=12.2.0` since the
  # security bump (27fd2063d), so every default-bundle eval served the superseded
  # major. A bare `>=12.2.0` would fix that while making the pin float, which
  # trades a stale-but-stable closure for a moving one.
  # Pinned to the version the project lock holds, so overlay and lock agree.
  # Changing this re-measures 13 gating floors (naver/v-splade-quality, docling).
  pillow: '==12.3.0'
  # grounding_dino
  requests: ''
  # gliner, gliner_bi (0.2.26: first release that loads the relex checkpoints)
  gliner: '>=0.2.26,<1'
  # gliner2. Held at 1.x: gliner2 2.0 changes gliner2-base/large-v1 outputs
  # (every repeated NER mention is returned, and structured extraction is
  # rescored). The GLiNER2.5-Decide models, which need 2.x, are served from
  # the transformers5 bundle.
  gliner2: '>=1.3.1,<2'
  # glirel
  glirel: '>=1.0,<2'
  # gliclass (0.1.17: cross-attention scorer for the multilingual checkpoints;
  # 0.1.18+ needs transformers 5)
  gliclass: '>=0.1.17,<1'
  # gliformer: exact, the adapter uses package internals (see pyproject.toml)
  gliformer: '==0.1.2'
  # gliner/glirel/gliclass shared dep
  loguru: '>=0.7,<1'
  # donut, florence2
  timm: '>=0.9.0,<1.0'
  # siglip (Marqo/marqo-ecommerce-embeddings-B uses open_clip native loader)
  open-clip-torch: '>=2.24'
  # docling — composite-document parser (PDF/DOCX/HTML).
  # Pinned to the compatibility pair of the immutable artifact revision in
  # models/docling.yaml; see packages/sie_server/pyproject.toml (#2872).
  docling: '>=2.99,<2.100'
  # Flash Attention 2 — CUDA only, prebuilt wheel
  flash-attn:
    url: https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.11/flash_attn-2.7.4+cu129torch2.9-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl
    marker: sys_platform == 'linux'

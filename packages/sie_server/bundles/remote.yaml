name: remote
priority: 1
default: false
# Remote profiles forward to an operator-defined upstream. A cluster serves
# them on a CPU worker lane that alone holds the upstream credentials. The
# default bundle lists the same adapters so a single server can serve them;
# this bundle's lower priority makes the gateway pick it whenever both match.
adapters:
- sie_server.adapters.remote.openai
- sie_server.adapters.remote.sie
deps:
  # The worker counts a hybrid model's upstream generation with the model's
  # own tokenizer. Tokenizer configs in the transformers-5 format (for example
  # GLM-5.3-Flash's TokenizersBackend) load only on transformers 5. The chart's
  # remote lane runs the transformers5 image, which provides this pin.
  transformers: '>=5.14,<6'

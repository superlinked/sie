profiles:
  default:
    max_batch_tokens: 8192
    # The KV budget is the SGLang pool size (--max-total-tokens), and the pool
    # bounds how many requests SGLang runs at once: it admits a request only
    # while the pool can hold its prompt plus max_tokens, and keeps 0.7
    # (decaying to 0.098) of each running request's unused max_tokens
    # reserved. A translation request (about 80 prompt and 110 output tokens,
    # max_tokens at the 1024 cap) holds about 300 tokens under steady load, so
    # SGLang ran about 25 at 8192 and runs about 105 at 32768. One L4 still
    # gains throughput from 64 to 128 in flight. This budget sets only the
    # engine's limit: in queue mode the worker sidecar also caps each pull
    # loop at SIE_PULL_LOOP_MAX_OUTSTANDING messages (default: the fetch
    # budget, 64), so a queue worker stays at 64 per pull loop until that
    # cap is raised.
    # Reservation in bf16: 4.0 GiB weights + 2.0 GiB KV (64 KiB per token)
    # + 3 GiB headroom, about 9 GiB, so a 10 GB GPU still fits it; 65536
    # would need about 11 GiB.
    kv_budget_tokens: 32768
    compute_precision: bfloat16
    adapter_path: sie_server.adapters.sglang.generation:SGLangGenerationAdapter
    adapter_options:
      loadtime:
        served_model_name: tencent/Hy-MT2-1.8B
        grammar_backend: xgrammar
        disable_piecewise_cuda_graph: true
        trust_remote_code: false
      runtime:
        default_sampling:
          temperature: 0.7
          top_p: 0.8
          top_k: 20
        first_chunk_timeout_s: 180
        inter_chunk_timeout_s: 10
        overall_timeout_s: 600
        stop_tokens:

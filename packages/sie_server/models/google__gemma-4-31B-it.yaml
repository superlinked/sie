  # ``h100-96k-hires`` with a longer answer budget. The profile-level
  # ``max_output_tokens`` raises the bare 4,096-token cap to 8,192, because
  # extracting every row of a dense multi-column page can need more than 4,096
  # answer tokens. The launch, image budget and answer-only mode are unchanged.
  # Like ``h100-96k-no-spec``, the grammar sibling extends the speculative

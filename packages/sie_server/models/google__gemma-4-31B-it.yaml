  # H200 has enough memory for the native window. These aliases expose the
  # tested hardware/context pairing while machine placement remains separate.
  h200-256k:
    extends: long-context
    grammar_profile: long-context-no-spec
  h200-256k-thinking:
    extends: long-context-thinking
    grammar_profile: long-context-thinking-no-spec
  # On H100-80GB this MTP launch shape measured a 108,896-token KV capacity.

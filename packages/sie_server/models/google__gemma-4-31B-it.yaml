        overall_timeout_s: 1800
        default_sampling:
          temperature: 1.0
          top_p: 0.95
          top_k: 64
          min_new_tokens: 1
        stop_tokens:
          - "<end_of_turn>"
  long-context-thinking-no-spec:
    max_output_tokens: 32768
    max_batch_tokens: 262144
    compute_precision: bfloat16
    adapter_path: sie_server.adapters.sglang.gemma:SGLangGemmaAdapter
    kv_budget_tokens: 262144
    chat_template_kwargs:
      enable_thinking: true
    adapter_options:
      loadtime:
        max_seq_length: 262144

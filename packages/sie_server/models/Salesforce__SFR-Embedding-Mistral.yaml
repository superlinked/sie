sie_id: Salesforce/SFR-Embedding-Mistral
hf_id: Salesforce/SFR-Embedding-Mistral
hf_revision: 33a60fe7b5e00b9414981280c571e8a4f9f42f1b
inputs:
  text: true
  image: false
  audio: false
  video: false
tasks:
  encode:
    dense:
      dim: 4096
    sparse: null
    multivector: null
  score: null
  extract: null
max_sequence_length: 4096
profiles:
  default:
    max_batch_tokens: 16384
    # Without a budget the automatic KV pool is max_sequence_length (4096
    # tokens), a quarter of one 16384-token batch, and the first batches
    # stall past the encode read timeout. 32768 holds two full batches and
    # matches the pool SFR-Embedding-2_R and Linq-Embed-Mistral derive from
    # their 32768-token context on the same Mistral-7B geometry.
    # Reservation in bf16: 13.9 GiB weights + 4.1 GiB KV (128 KiB per token)
    # + 3 GiB headroom, about 21 GiB.
    kv_budget_tokens: 32768
    compute_precision: bfloat16
    adapter_path: sie_server.adapters.sglang.embedding:SGLangEmbeddingAdapter
    adapter_options:
      loadtime:
        # Mistral-family last-token embedder: SGLang does not auto-append EOS for
        # this architecture, so last-token pooling reads the wrong position and
        # retrieval collapses (#1489). Append the model's own EOS at encode time.
        append_eos: true
      runtime:
        pooling: last_token
        normalize: true
        query_template: |-
          Instruct: {instruction}
          Query: {text}
        default_instruction: Given a web search query, retrieve relevant passages that answer the query

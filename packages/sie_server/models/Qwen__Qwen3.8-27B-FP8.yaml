          - "bfloat16"
          - "--mamba-scheduler-strategy"
          - "extra_buffer"
          - "--disable-overlap-schedule"
          - "--page-size"
          - "64"
          - "--chunked-prefill-size"
          - "32768"
          - "--max-prefill-tokens"
          - "32768"
          - "--max-running-requests"
          - "1"
          - "--cuda-graph-max-bs"
          - "1"

  # RTX PRO 6000 96GB (SM120): retain FlashInfer and 2K prefill chunks from the
  # official Blackwell recipe while sharing the measured BF16 GDN state and
  # profile-scoped DeepGEMM fast warmup. Both RTX profiles deliberately leave
  # --max-prefill-tokens at SGLang's pinned default; only the chunk granularity
  # is overridden here, and the Stage-5 full-window smoke guards that pairing.

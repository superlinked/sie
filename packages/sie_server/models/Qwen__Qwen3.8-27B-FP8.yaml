          - "32768"
          - "--max-prefill-tokens"
          - "32768"
          - "--max-running-requests"
          - "1"
          - "--cuda-graph-max-bs"
          - "1"
      runtime:
        first_chunk_timeout_s: 900
        inter_chunk_timeout_s: 30
        overall_timeout_s: 1800
        default_sampling:
          temperature: 0.7
          top_p: 0.8
          top_k: 20
          presence_penalty: 1.5
        stop_tokens:
          - "<|im_end|>"
  h200-256k-no-spec:
    extends: h200-256k
    adapter_options:
      loadtime:
        max_seq_length: 262144

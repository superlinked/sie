          num_draft_tokens: 4
        extra_launch_args:
          - "--mm-process-config"
          - '{"image":{"min_pixels":65536,"max_pixels":1003520}}'
          - "--kv-cache-dtype"
          - "bfloat16"
          - "--mamba-ssm-dtype"
          - "bfloat16"
          - "--mamba-scheduler-strategy"
          - "extra_buffer"
          - "--disable-overlap-schedule"

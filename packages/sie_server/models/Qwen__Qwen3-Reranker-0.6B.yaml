  # as a CUDA graph. An extending profile restates the load-time options.
  fast:
    extends: default
    adapter_options:
      loadtime:
        yes_token: "yes"
        no_token: "no"
        input_format: qwen3
        score_mode: log_softmax
        default_instruction: "Given a web search query, retrieve relevant passages that answer the query"
        fused_kernels: true
        prefix_reuse: true
        prefix_cache_mb: 512
        cuda_graphs: bucketed
        cuda_graph_tokens: 512

# Joint protocol v3: an item's questions share one row (state, questions,
# options, one readout marker each). Rows over this window are bisected by
# question, every chunk keeping the full state. Training used rows up to
# about 32k tokens; 8,192 keeps the qualified serving window of the 27B entry.

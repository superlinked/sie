sie_id: topk-io/topk-embed-v1-small
hf_id: topk-io/topk-embed-v1-small
hf_revision: 33b15d544d74f29d04cdb97adeb9fd0e52da5fb7
inputs:
  # Text queries; text or page-image documents (one image per document).
  text: true
  image: true
  audio: false
  video: false
tasks:
  encode:
    dense: null
    sparse: null
    multivector:
      dim: 2048
  score: null
  extract: null
# Document cap. The checkpoint allows 8192 tokens (sentence_bert_config.json
# document_length), but on the cluster path one item's result must serialize
# under 16 MiB (sidecar MAX_CHUNKED_RESULT_BYTES, gateway per-item limit): at
# 2048 float16 numbers a token that is 4096 tokens, so 4000 keeps each document
# at 15.6 MiB with room for the envelope. float32 responses take twice as much.
# The adapter caps queries at query_length (1024) and each image at 1280 merged
# patches (5 MiB).
max_sequence_length: 4000
profiles:
  default:
    max_batch_tokens: 8192
    compute_precision: bfloat16
    adapter_path: sie_server.adapters.topk_embed.adapter:TopkEmbedAdapter
    adapter_options:
      loadtime:
        # CUDA graphs for small text batches (queries) on the packed CUDA path;
        # anything else runs eagerly. See adapters/topk_embed/graphs.py.
        cuda_graphs: bucketed
        text_batch_tokens: 8192
        muvera_config:
          num_repetitions: 40
          num_simhash_projections: 6
          projection_dim: null
          final_projection_dim: 10240
        # Sparse Multi-Vector Encoding for the smve profile: TopK's width and k
        # (SMVE runs on the model's GPU). Pages and long documents keep their 8192
        # largest values, which bounds their size and, on a page benchmark,
        # surfaced more of the exact MaxSim top 10 than keeping every value.
        smve_config:
          width: 65536
          k: 32
          max_nonzeros: 8192
      runtime:
        normalize: true
        # The model computes in bf16, so float16 loses nothing and halves the
        # payload (a page is ~1230 token vectors). Clients can ask for float32.
        output_dtype: float16
  muvera:
    extends: default
    adapter_options:
      runtime:
        normalize: true
        output_types:
        - dense
        output_similarity:
          dense: dot
        muvera: {}
  smve:
    extends: default
    adapter_options:
      runtime:
        normalize: true
        output_types:
        - sparse
        output_similarity:
          sparse: dot
        smve: {}

sie_id: nomic-ai/modernbert-embed-base
hf_id: nomic-ai/modernbert-embed-base
hf_revision: d556a88e332558790b210f7bdbe87da2fa94a8d8
inputs:
  text: true
  image: false
  audio: false
  video: false
tasks:
  encode:
    dense:
      dim: 768
    sparse: null
    multivector: null
  score: null
  extract: null
max_sequence_length: 8192
profiles:
  default:
    max_batch_tokens: 16384
    compute_precision: bfloat16
    adapter_path: sie_server.adapters.modernbert_flash:ModernBERTFlashAdapter
    adapter_options:
      loadtime:
        cuda_graphs: bucketed
      runtime:
        pooling: mean
        normalize: true
        query_template: 'search_query: {text}'
        doc_template: 'search_document: {text}'
  candle:
    extends: default
    adapter_path: sie_server_rust.adapters.candle:CandleEmbeddingAdapter
    adapter_options:
      # Its own load-time options, so the default profile's cuda_graphs (a
      # PyTorch setting) does not reach the Candle worker, which refuses it.
      loadtime:
        max_seq_length: 8192
      runtime:
        pooling: mean
        normalize: true
        query_template: 'search_query: {text}'
        doc_template: 'search_document: {text}'

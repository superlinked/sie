[package]
edition = "2021"
name = "candle-splade-pool"
version = "0.0.1"
build = "build.rs"
publish = false
description = "CUDA segmented max-log1p pooling for packed SPLADE activations."
license = "MIT OR Apache-2.0"

[lib]
name = "candle_splade_pool"
path = "src/lib.rs"

[dependencies.candle]
version = "0.10.2"
features = ["cuda"]
package = "candle-core"

[dependencies.half]
version = "2.3.1"
features = ["num-traits"]

[build-dependencies.anyhow]
version = "1"
features = ["backtrace"]

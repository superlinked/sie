# Migration ledger for the Prometheus families registered at source_revision.
# Legacy names are documentation/query-rewrite inputs, never producer aliases.
# Canonical metrics first introduced on this branch, such as
# sie.gateway.admission.decisions, are current contract entries rather than
# legacy migrations and therefore do not inflate this inventory.
schema_version: 1

inventory:
  source_revision: ba79a1e5b3e3e4056a12d764b93118f10ad056f1
  declared_family_total: 245
  sorted_family_sha256: 9190bc29c8564c90dd998d010d717064e346deb767b94f0e862a58b981592a9f
  owner_counts:
    gateway: 54
    cloud_gateway_i6pn: 15
    config: 7
    python_engine: 49
    rust_engine: 45
    worker_sidecar: 75

classification_semantics:
  direct: one legacy semantic has a canonical dotted replacement
  collapsed: overlapping legacy semantics are dimensions or outcomes of a canonical metric
  derived: the legacy view is reconstructed by querying canonical metrics
  narrowed: the legacy family name remains but only a safety-critical bounded semantic subset is retained
  retired: the legacy view is intentionally unavailable because it was redundant, unbounded, or unactionable

invariants:
  single_emission: true
  producer_aliases: forbidden
  producer_duplicate_emission: forbidden
  legacy_names_are_documentation_only_except_declared_collector_compatibility: true
  collector_compatibility_families: []
  compatibility_owner: collector_exporter_configuration

keda:
  legacy_to_canonical_rejection_reason_renames:
    queue_publish_failed: publish_ack_failed
  legacy_control_families:
    - legacy_family: sie_gateway_pending_demand
      canonical_metric: sie.gateway.pending_demand
      legacy_labels: [pool, machine_profile, bundle]
      canonical_labels: [pool, machine_profile, bundle]
    - legacy_family: sie_gateway_worker_queue_depth
      canonical_metric: sie.gateway.lane.queue.depth
      legacy_labels: [pool, worker, machine_profile, bundle]
      canonical_labels: [pool, machine_profile, bundle]
      canonical_prometheus_family: sie_gateway_lane_queue_depth
      compatibility: retired_no_alias
      semantic_change: worker_heartbeat_gauge_replaced_by_exact_durable_consumer_backlog
    - legacy_family: sie_gateway_active_lease_gpus
      canonical_metric: sie.gateway.active_lease.gpus
      legacy_labels: [pool, machine_profile, bundle]
      canonical_labels: [pool, machine_profile, bundle]
    - legacy_family: sie_gateway_pool_warm_floor
      canonical_metric: sie.gateway.pool.warm_floor
      legacy_labels: [pool, machine_profile, bundle]
      canonical_labels: [pool, machine_profile, bundle]
    - legacy_family: sie_gateway_rejected_requests_total
      canonical_metric: sie.gateway.rejected.requests
      legacy_labels: [pool, machine_profile, bundle, reason]
      canonical_labels: [pool, machine_profile, bundle, reason, scaling_action]
      retained_reasons: [backpressure, no_consumers, publish_ack_failed, upstream_result_timeout]
      omitted_semantics: every_non_scale_up_rejection


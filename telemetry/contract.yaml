    export: [prometheus, otlp]
  - name: sie.worker.inference.duration
    owner: worker_engine
    facade_event: worker.item_completed
    type: histogram
    unit: s
    measurement: one_observation_per_completed_item_and_non_null_phase
    attributes: worker_phase

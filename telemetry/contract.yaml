schema_version: 1
contract_version: "2026-08-27"

# This is the machine-readable telemetry source of truth. A request path emits
# one typed semantic event; the owning facade is the only code allowed to turn
# it into OTel instruments or log records. Every application exports each
# observation once through OTLP; the collector translates and routes it to
# Prometheus and/or a remote OTLP backend.
invariants:
  producer_api: opentelemetry
  single_emission: true
  application_export_protocol: otlp
  application_metric_readers_per_provider: 1
  application_metric_exporters_per_reader: 1
  application_metric_temporality:
    counter: delta
    histogram: delta
    observable_counter: delta
    up_down_counter: cumulative
    gauge: current_value
  application_temporality_environment_override: forbidden
  better_stack_metric_temporality_conversion: none
  prometheus_delta_accumulation: collector_exporter
  collector_self_metric_source: cumulative_prometheus_scrape
  disabled_behavior: facade_noop
  disabled_sdk_instruments: none
  disabled_http_middleware: omitted
  disabled_point_attribute_construction: forbidden
  export_failure_behavior: bounded_fail_open
  prometheus_is_collector_exporter: true
  in_process_prometheus_instrumentation: forbidden
  vendor_credentials_in_producers: false
  arbitrary_metric_attributes: false
  arbitrary_managed_logs: false

cardinality_budgets:
  worker_python_facade:
    scope: per_process_per_instrument
    sdk_series_retention: process_lifetime
    sdk_default_series_limit: unbounded
    collapse_before_sdk_aggregation: true
    catalog_model_profile_pairs:
      admitted_exact_process_lifetime: 256
      collapsed_overflow_pairs: 1
      total_series_pairs: 257
      overflow_labels: {model: other, profile: other}
      overflow_backend: other
      overflow_effect: telemetry_only_serving_fail_open
      warning: at_most_once_per_process
    fixed_domains:
      lane_per_process: 1
      operation: operation
      worker_outcome: worker_outcome
      inference_phase: inference_phase
      unit_type: unit_type
    instrument_limits:
      shared_worker_request:
        metrics: [sie.worker.requests, sie.worker.request.duration]
        formula: catalog_series_pairs * operation * worker_outcome
        limit: 8995
      shared_worker_phase:
        metrics: [sie.worker.inference.duration]
        formula: catalog_series_pairs * operation * worker_outcome * inference_phase
        limit: 26985
      shared_worker_units:
        metrics: [sie.worker.units]
        formula: catalog_series_pairs * operation * unit_type
        limit: 5397
    applies_to:
      service: sie-worker
      runtime: python
      attribute_sets:
        - worker_queue
        - worker_batch
        - worker_batch_core
        - worker_request
        - worker_phase
        - worker_units
        - worker_model
        - worker_model_load
        - worker_oom
        - worker_runtime
        - worker_eviction
        - worker_scheduler
        - worker_adaptive_p50
        - generation_stream
        - generation_tokens
        - generation_admission
        - generation_duplicate
        - generation_grammar
        - generation_grammar_cache
        - generation_grammar_compile
  worker_rust_facade:
    scope: per_process_per_instrument
    sdk_series_retention: process_lifetime
    sdk_default_series_limit: 2000
    collapse_before_sdk_aggregation: true
    catalog_model_profile_pairs:
      admitted_exact_process_lifetime: 256
      collapsed_overflow_pairs: 1
      total_series_pairs: 257
      overflow_labels: {model: other, profile: other}
      overflow_backend: other
      overflow_effect: telemetry_only_serving_fail_open
      warning: at_most_once_per_process
    request_detail_model_profile_pairs:
      admitted_exact_process_lifetime: 32
      collapsed_overflow_pairs: 1
      total_series_pairs: 33
      admission_subset_of: catalog_model_profile_pairs
      selection: first_observed_distinct_catalog_pairs
      overflow_labels: {model: other, profile: other}
      overflow_backend: other
      overflow_effect: telemetry_only_serving_fail_open
      applies_to:
        - sie.worker.requests
        - sie.worker.request.duration
        - sie.worker.inference.duration
        - sie.worker.units
    forward_detail_model_profile_pairs:
      admitted_exact_process_lifetime: 4
      collapsed_overflow_pairs: 1
      total_series_pairs: 5
      admission_subset_of: catalog_model_profile_pairs
      selection: first_observed_distinct_catalog_pairs
      overflow_labels: {model: other, profile: other}
      overflow_backend: other
      overflow_effect: telemetry_only_serving_fail_open
      applies_to: [sie.worker.runtime.forward.duration]
    fixed_domains:
      lane_per_process: 1
      operation: operation
      worker_outcome: worker_outcome
      inference_phase: inference_phase
      unit_type: unit_type
      model_load_outcome: model_load_outcome
      model_load_stage: model_load_stage
      oom_strategy: oom_strategy
      oom_outcome: oom_outcome
      eviction_reason: eviction_reason
      forward_state: forward_state
      forward_outcome: forward_outcome
      forward_input_source: forward_input_source
      forward_output_path: forward_output_path
      forward_stage: forward_stage
    instrument_limits:
      shared_worker_request:
        metrics: [sie.worker.requests, sie.worker.request.duration]
        formula: request_detail_series_pairs * operation * worker_outcome
        limit: 1155
      shared_worker_phase:
        metrics: [sie.worker.inference.duration]
        formula: request_detail_series_pairs * operation * worker_outcome * inference_phase
        limit: 3465
      shared_worker_units:
        metrics: [sie.worker.units]
        formula: request_detail_series_pairs * operation * unit_type
        limit: 693
      model_state:
        metrics: [sie.worker.model.loaded, sie.worker.model.memory, sie.worker.runtime.forward.limit]
        formula: catalog_series_pairs
        limit: 257
      model_load:
        metrics: [sie.worker.model.load.duration]
        formula: catalog_series_pairs * model_load_outcome * model_load_stage
        limit: 5140
      oom_recovery:
        metrics: [sie.worker.oom.recoveries]
        formula: catalog_series_pairs * oom_strategy * oom_outcome
        limit: 4112
      model_eviction:
        metrics: [sie.worker.model.evictions]
        formula: catalog_series_pairs * eviction_reason
        limit: 2570
      forward_duration:
        metrics: [sie.worker.runtime.forward.duration]
        formula: forward_detail_series_pairs * forward_outcome * forward_input_source * forward_output_path * forward_stage
        limit: 8460
      forward_permit:
        metrics: [sie.worker.runtime.forward.permit.wait]
        formula: catalog_series_pairs * forward_output_path
        limit: 1542
      forward_activity:
        metrics: [sie.worker.runtime.forward.concurrent]
        formula: catalog_series_pairs * forward_state
        limit: 514
    sdk_retained_memory_ceiling:
      pinned_sdk: opentelemetry_sdk_0_32_1
      readers_per_provider: 1
      tracker_maps: 13
      tracker_map_capacity_rule: one_plus_cardinality_limit
      requested_initial_tracker_capacity_entries: 29590
      total_instrument_series_limits: 29577
      maximum_single_instrument_series: 8460
      explicit_histogram_bucket_counter_cells_at_full_limits: 379022
      bucket_counter_payload_bytes_at_full_limits: 3032176
      bucket_counter_payload_bytes_with_one_export_snapshot: 6064352
      additional_bounded_overhead:
        - hash_table_control_bytes
        - tracker_and_attribute_key_value_allocations
        - allocator_rounding
    applies_to:
      service: sie-worker
      runtime: rust
      attribute_sets:
        - worker_request
        - worker_phase
        - worker_units
        - worker_model
        - worker_model_load
        - worker_oom
        - worker_eviction
        - worker_forward
        - worker_forward_permit
        - worker_forward_activity
  worker_sidecar:
    scope: per_process_per_instrument
    sdk_default_series_limit: 2000
    catalog_model_profile_pairs:
      admitted_exact_process_lifetime: 256
      collapsed_overflow_pairs: 1
      total_series_pairs: 257
      overflow_labels: {model: other, profile: other}
      overflow_effect: telemetry_only_serving_fail_open
      warning: at_most_once_per_process
    fixed_domains:
      lane_per_process: 1
      operation: operation
      flush_reason: flush_reason
      ipc_method: ipc_method
      ipc_outcome: ipc_outcome
      ipc_response_chunk_outcome: ipc_response_chunk_outcome
      config_source: sidecar_config_source
      config_operation: sidecar_config_operation
      config_outcome: sidecar_config_outcome
      nats_operation: nats_operation
      binary_outcome: binary_outcome
      nats_reason: nats_reason
      delivery_redelivered: delivery_redelivered
      payload_reason: payload_reason
      slot_state: slot_state
      ipc_transport: ipc_transport
      scheduler_p50_kind: scheduler_p50_kind
      generation_loading_state: generation_loading_state
      generation_response_outcome: generation_response_outcome
      shutdown_drain_outcome: shutdown_drain_outcome
      result_transport_mode: result_transport_mode
      result_transport_outcome: result_transport_outcome
    instrument_limits:
      queue_and_batch_core:
        metrics:
          - sie.worker.queue.duration
          - sie.worker.queue.depth
          - sie.worker.batch.size
          - sie.worker.batch.cost
          - sie.worker.scheduler.request_batch.dispatch_wait
          - sie.worker.scheduler.request_batch.total
        formula: operation * catalog_series_pairs
        limit: 1799
      work_item_age:
        metrics: [sie.worker.work_item.age]
        formula: operation * lane_per_process
        limit: 7
      batch_fill:
        metrics: [sie.worker.batch.fill_ratio]
        formula: operation * catalog_series_pairs * flush_reason
        limit: 14392
      scheduler_base:
        metrics:
          - sie.worker.scheduler.adaptive.wait
          - sie.worker.scheduler.adaptive.cost
          - sie.worker.scheduler.starvation.resets
        formula: catalog_series_pairs
        limit: 257
      scheduler_p50:
        metrics: [sie.worker.scheduler.adaptive.p50]
        formula: catalog_series_pairs * scheduler_p50_kind
        limit: 514
      ipc:
        metrics: [sie.worker.ipc.requests, sie.worker.ipc.request.duration]
        formula: ipc_method * ipc_outcome
        limit: 98
      ipc_response_chunks:
        metrics:
          - sie.worker.ipc.response.chunks
          - sie.worker.ipc.response.reconstructed.size
          - sie.worker.ipc.response.chunk.count
          - sie.worker.ipc.response.chunk.reserved
        formula: ipc_response_chunk_outcome * lane_per_process
        limit: 3
      config_apply:
        metrics: [sie.worker.config.applies]
        formula: config_source * config_operation * config_outcome
        limit: 324
      config_state:
        metrics: [sie.worker.config.epoch, sie.worker.config.degraded]
        formula: config_source
        limit: 3
      nats:
        metrics: [sie.worker.nats.operations]
        formula: nats_operation * binary_outcome * nats_reason
        limit: 210
      nats_delivery:
        metrics: [sie.worker.nats.delivery.attempts]
        formula: delivery_redelivered
        limit: 2
      result_transport:
        metrics:
          - sie.worker.result.transport.attempts
          - sie.worker.result.chunks.published
          - sie.worker.result.chunk.size
        formula: result_transport_mode * result_transport_outcome * lane_per_process
        limit: 16
      payload:
        metrics:
          - sie.worker.payload.fetches
          - sie.worker.payload.fetch.duration
          - sie.worker.payload.size
        formula: binary_outcome * payload_reason
        limit: 24
      slots:
        metrics: [sie.worker.gpu.slots]
        formula: slot_state
        limit: 2
      lane_state:
        metrics:
          - sie.worker.pending.items
          - sie.worker.pending.cost
          - sie.worker.inflight.batches
          - sie.worker.saturated
        formula: lane_per_process
        limit: 1
      ipc_transport:
        metrics: [sie.worker.ipc.capacity, sie.worker.ipc.inflight]
        formula: ipc_transport
        limit: 3
      ipc_acquire:
        metrics: [sie.worker.ipc.acquire.duration]
        formula: ipc_transport * binary_outcome
        limit: 9
      generation_loading:
        metrics: [sie.worker.generation.model_loading.responses]
        formula: catalog_series_pairs * generation_loading_state * generation_response_outcome
        limit: 4112
      shutdown:
        metrics: [sie.worker.shutdown.drain.duration]
        formula: shutdown_drain_outcome
        limit: 3
  keda_physical_lane_domain:
    source: SIE_GATEWAY_CONFIGURED_PHYSICAL_LANES
    tuple: [pool, machine_profile, bundle]
    normalization: trim_then_lowercase
    allowed_characters: "^[A-Za-z0-9_-]+$"
    maximum_component_length: 63
    maximum_configured_lanes: 1024
    reconciliation:
      interval_seconds: 5
      snapshot_timeout_seconds: 4
      broker_query_concurrency_per_replica: 32
      maximum_gateway_replicas: 10
      replica_stagger: process_start_uuid_hash_modulo_interval
    emission: exact_catalog_members_only
    unresolved_lane_behavior: omit_control_metric
    synthetic_fallback_lane: forbidden
    sdk_stream_cardinality:
      lane_state_gauges: 1024
      scale_up_rejections: 4096
      overflow_series: forbidden
    applies_to:
      - sie.gateway.pending_demand
      - sie.gateway.lane.queue.depth
      - sie.gateway.lane.queue.snapshot.timestamp
      - sie.gateway.active_lease.gpus
      - sie.gateway.pool.warm_floor
      - sie.gateway.rejected.requests
  # Per-lane queue admission reuses the same deployment-owned lane tuple and
  # the same fail-closed rules as the KEDA control domain, but is not itself a
  # KEDA control signal: its Prometheus spelling is not a scaler API.
  gateway_lane_admission_domain:
    source: SIE_GATEWAY_CONFIGURED_PHYSICAL_LANES
    tuple: [pool, machine_profile, bundle]
    normalization: trim_then_lowercase
    allowed_characters: "^[A-Za-z0-9_-]+$"
    maximum_component_length: 63
    maximum_configured_lanes: 1024
    emission: exact_catalog_members_only
    unresolved_lane_behavior: omit_decision_metric
    synthetic_fallback_lane: forbidden
    sdk_stream_cardinality:
      # 1024 configured lanes x 3 lane_admission_outcome values.
      lane_admission_decisions: 3072
      overflow_series: forbidden
    applies_to:
      - sie.gateway.queue.lane_admission.decisions

scope:
  included: all_production_metrics_keda_control_signals_and_privacy_approved_managed_logs
  excluded_until_declared:
    - lane_lifecycle_signals
    - service_log_events_other_than_the_declared_gateway_completion_record
  rule: a_new_instrument_must_be_declared_before_it_is_emitted

field_semantics:
  metrics.export: collector_output_eligibility
  logs.export: collector_output_eligibility
  traces.remote_export: collector_privacy_boundary

measurement_semantics:
  generation_tpot:
    start: first_output_bearing_event
    end: last_output_bearing_event
    formula: max(end_minus_start_seconds, 0) / denominator
    denominator:
      preferred: authoritative_positive_completion_token_count
      fallback: observed_output_bearing_event_count
      convention: includes_first_output
    unmeasurable: omit_when_fewer_than_two_timed_output_events
    rationale: preserves_the_existing_total_latency_equals_ttft_plus_tpot_times_output_tokens_convention
  scheduler_request_batch_dispatch_wait:
    sample: one_per_unique_successful_request_id_per_backend_batch
    start: scheduler_enqueue
    end: instant_immediately_before_run_batch_dispatch
    filter: item_outcome_publish_and_ack
    deduplication: first_successful_request_id_occurrence_in_batch_iteration_order
  scheduler_request_batch_total:
    sample: one_per_unique_successful_request_id_per_backend_batch
    start: scheduler_enqueue
    end: completed_run_batch_reply
    filter: item_outcome_publish_and_ack
    deduplication: first_successful_request_id_occurrence_in_batch_iteration_order

resource_attributes:
  required:
    - service.name
    - service.instance.id
    - deployment.environment
    - cloud.region
  optional:
    - service.version
  resolution:
    service.instance.id:
      substrate_prefix_env: SIE_TELEMETRY_INSTANCE_ID
      kubernetes_prefix: "$(POD_UID)/<container-name>"
      composition: "<substrate-prefix>/<process-start-uuid>"
      fallback: process_start_uuid_shared_across_signals
      collector_self_source:
        kubernetes: collector_file_provider_reads_proc_random_uuid_once_then_trims
        managed_modal: launcher_generated_process_start_uuid_env
      requirement: unique_per_process_start_including_same_container_restarts
    deployment.environment:
      producer_env: SIE_OTEL_DEPLOYMENT_ENVIRONMENT
      managed_values: [dev, staging, prod]
      fallback: unknown_local_only
      requirement: explicit_on_every_operated_deployment
    cloud.region:
      producer_env: SIE_OTEL_CLOUD_REGION
      fallback: unknown_local_only
      requirement: explicit_on_every_operated_deployment
  forbidden_as_point_attributes:
    - deployment.environment
    - cloud.region
    - service.version

services:
  control_plane:
    service_name: sie-control-plane
    managed_collector: control_plane
  gateway:
    service_name: sie-gateway
    managed_collector: regional
    runtimes:
      - packages/sie_gateway
  dispatcher:
    service_name: sie-dispatcher
    managed_collector: regional
    runtimes: []
  config:
    service_name: sie-config
    managed_collector: regional
    runtimes:
      - packages/sie_config
  worker_sidecar:
    service_name: sie-worker-sidecar
    managed_collector: regional
    runtimes:
      - packages/sie_server_sidecar
  worker_engine:
    service_name: sie-worker
    managed_collector: regional
    runtimes:
      - packages/sie_server
      - packages/sie_server_rust
  worker_python_engine:
    service_name: sie-worker
    managed_collector: regional
    runtimes:
      - packages/sie_server
  worker_rust_engine:
    service_name: sie-worker
    managed_collector: regional
    runtimes:
      - packages/sie_server_rust

conditional_owners:
  worker_queue_owner:
    realtime: worker_sidecar
    modal_native: worker_python_engine
    invariant: exactly_one_owner_per_observation
  worker_scheduler_owner:
    realtime: worker_sidecar
    modal_native: worker_python_engine
    invariant: exactly_one_owner_per_observation

export_profiles:
  oss:
    application_exporters: [otlp]
    collector_metric_exporters: [prometheus]
    collector_log_exporters: [structured_stdout]
  managed_modal:
    application_exporters: [otlp]
    collector_metric_exporters: [otlp]
    collector_log_exporters: [otlp]
  kubernetes_with_remote_telemetry:
    # The collector fans one OTLP observation out. Producers still emit once.
    application_exporters: [otlp]
    collector_metric_exporters: [prometheus, otlp]
    collector_log_exporters: [structured_stdout, otlp]
  requirements:
    application_otlp:
      destination: regional_otel_collector
      protocol: http/protobuf_or_grpc
      metrics_export_interval_max_seconds: 5
      fail_open: true
    collector_prometheus:
      listen: 0.0.0.0:9464
      endpoint: /metrics
      source: otel_collector_prometheus_exporter
      resource_to_telemetry_conversion:
        enabled: false
      standard_target_identity:
        job: service.name
        instance: service.instance.id
      prometheus_scrape_identity:
        honor_labels: false
        target_labels: [namespace, service, endpoint]
        producer_service: collector_trusted_receiver_identity
        producer_instance: sanitized_service_instance_id
        collector_generation: procfs_uuid_read_once_per_collector_process_config_load
        service_monitor_exported_label_copy: forbidden
      service_monitor_scrape_interval_max_seconds: 5
    collector_remote_otlp:
      vendor_routing: collector_only

metric_processing:
  # Metric receivers are trust boundaries. The dotted name and the exact
  # point-attribute set below are the wire contract, not suggestions to a
  # dashboard author. Collector branches fail closed before Prometheus name
  # normalization or remote export.
  undeclared_metric_names: drop
  receiver_name_allowlists:
    gateway: owner_gateway_only
    application: non_gateway_owners_only
    managed_modal_shared: declared_remote_metrics_bound_to_owner_service
  owner_service_binding:
    policy: exact
    unknown_service: drop
    cross_owner_metric: drop
    conditional_owners:
      worker_queue_owner: [sie-worker, sie-worker-sidecar]
      worker_scheduler_owner: [sie-worker, sie-worker-sidecar]
  resource_attributes:
    allow:
      - service.name
      - service.instance.id
      - deployment.environment
      - cloud.region
      - service.version
    unknown: drop
    schema_url: clear
    operated_environment_and_region: collector_authoritative
  scope:
    attributes: drop_all
    name: clear
    version: clear
    schema_url: clear
  descriptor:
    description: clear
    unit: canonicalize_from_metric_declaration
  prometheus_compatibility:
    # The pinned collector appends `_ratio` for canonical unit `1`. Clear the
    # unit only on the local Prometheus branch to retain the established wire
    # family while the canonical OTel instrument remains dimensionless.
    sie.gateway.pool.pinned_model.loaded:
      unit_override: ""
      prometheus_name: sie_gateway_pool_pinned_model_loaded
  datapoint_attributes:
    policy: exact_metric_attribute_set
    unknown: drop
  exemplars:
    policy: forbidden
    producer_filter: always_off
    collector_runtime_assertion: zero_remote_exemplars
  prometheus_identity:
    policy: collector_authored
    producer_service: trusted_receiver_service_name
    producer_instance: service.instance.id
    collector_generation: prometheus_only_process_generation_uuid
    service_monitor_exported_label_copy: forbidden

traces:
  # Producers emit one normal OTel trace stream. The collector preserves that
  # stream for an explicitly configured local OSS/Tempo exporter, but a
  # separate branch applies this fail-closed allowlist before any span reaches
  # Better Stack. Topology and latency remain useful without forwarding
  # request-derived attributes, exception events, or arbitrary status text.
  remote_privacy:
    destination: better_stack
    policy: allowlist
    identity:
      operated_environment_and_region: collector_authoritative
      service_instance_id: producer_process_identity
      service_version: producer_optional
      helm_receiver_binding:
        gateway:
          service_name: collector_authoritative_sie-gateway
        application:
          service_name_allow: [sie-config, sie-dispatcher, sie-worker, sie-worker-sidecar]
          unknown_service: drop
          gateway_claim: drop
      managed_modal_shared:
        service_name_allow: [sie-config, sie-dispatcher, sie-gateway, sie-worker, sie-worker-sidecar]
        unknown_service: drop
      local_oss_action: retain_producer_identity_unchanged
    resource_attributes:
      allow:
        - service.name
        - service.instance.id
        - deployment.environment
        - cloud.region
        - service.version
      unknown: drop
      schema_url: clear
    scope:
      attributes: drop_all
      name: clear
      version: clear
      schema_url: clear
    span:
      attributes: drop_all
      events: drop_all
      status_message: clear
      trace_state: clear
      # Trace/span/parent ids, start/end timestamps, span kind, status code and
      # flags are structural OTel fields and remain untouched on retained
      # spans. Links are not: every link can carry arbitrary attributes and
      # trace-state text, and the pinned collector cannot mutate them in place.
      retain:
        - topology
        - timing
        - ids
        - kind
        - status_code
        - flags
      linked_spans:
        remote_action: drop_entire_span
        condition: Len(links) > 0
        reason: pinned_collector_cannot_reliably_clear_link_attributes_or_trace_state
        transform_defense: set_links_empty_for_future_runtime_support
        local_oss_action: retain_unchanged
      name:
        unknown: other
        allow:
          - gateway.request
          - gateway.publish
          - gateway.proxy
          - gateway.proxy_chat
          - gateway.proxy_request
          - gateway.proxy_generate
          - sidecar.dispatch
          - worker.run_batch
          - worker.streaming_processor
          - encode
          - score
          - extract
          - generate
          - openai_embeddings
          - chat_completions
          - rerank
          - other
  local_oss:
    destination: configured_tempo_or_debug_exporter
    policy: producer_trace_unchanged

enums:
  operation: [encode, score, extract, embeddings, moderations, generate, other]
  activity_window: [1h, 24h]
  signup_review_status: [pending, approved, rejected, other]
  launch_credit_status: [pending, approved, rejected, other]
  request_outcome: [success, redirect, client_error, server_error, other]
  admission_outcome:
    - admitted
    - unauthenticated
    - forbidden
    - auth_misconfigured
    - region_mismatch
    - license_excluded
    - payload_too_large
    - insufficient_credits
    - key_spend_limit_exceeded
    - rate_limited
    - other
  # `discarded` is a 200 whose snapshot body did not strictly advance the held
  # version, so the replica parsed and then dropped it. Keeping it distinct from
  # `installed` is the point of the family: a bare 200-vs-304 split cannot tell
  # a useful fetch from a wasted one.
  key_snapshot_poll_outcome: [not_modified, installed, discarded, error]
  # `skipped` is the no-reservation branch, which issues no control-plane call
  # and therefore contributes no duration observation.
  settlement_confirm_outcome: [success, error, skipped]
  gateway_dispatch_path: [i6pn, modal, other]
  dispatcher_path: [modal_remote, modal_stream, modal_spawn, generation_ws, other]
  dispatch_outcome: [success, error, timeout, cancelled, not_found, other]
  # `rejected` (the tenant's config cannot be served) is deliberately distinct from
  # `error` (SIE broke): only the second is an incident. `other` is the facade's
  # _bounded() collapse — an unclassified outcome must never mint a time series.
  sealed_stage_outcome: [success, rejected, error, other]
  # The sealed GPU ladder, mirrored by `telemetry._SEALED_GPU_CLASSES`. A class
  # outside the ladder collapses to `other` (the facade's `_bounded()`) and an
  # absent one to `unknown`, so a caller can never mint a time series.
  sealed_gpu_class: [t4, l4, a10g, a100, a100-80gb, h100, other, unknown]
  fallback_reason:
    - none
    - disabled
    - not_applicable
    - unknown_lane
    - no_live_channel
    - no_credit
    - lane_error
    - timeout
    - transport_failure

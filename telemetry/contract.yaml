    buckets: worker_model_load_seconds
    prometheus_name: sie_worker_model_load_duration_seconds
    export: [prometheus, otlp]
  - name: sie.worker.model.memory
    owner: worker_engine
    facade_event: worker.model_residency_changed
    type: gauge
    unit: By
    attributes: worker_model
    prometheus_name: sie_worker_model_memory_bytes
    export: [prometheus, otlp]
    measurement: authoritative_only
  - name: sie.worker.oom.recoveries
    owner: worker_engine
    facade_event: worker.oom_recovery_completed
    type: counter
    unit: "{recovery}"
    attributes: worker_oom
    prometheus_name: sie_worker_oom_recoveries_total
    export: [prometheus, otlp]
  - name: sie.worker.model.evictions
    owner: worker_engine
    facade_event: worker.model_evicted
    type: counter
    unit: "{model}"
    attributes: worker_eviction
    prometheus_name: sie_worker_model_evictions_total
    export: [prometheus, otlp]

  # Generation is currently implemented by the Python engine. It remains in
  # the same sie-worker service stream and uses the same bounded catalog
  # dimensions as the shared engine contract.
  - name: sie.worker.generation.ttft
    owner: worker_python_engine
    facade_event: worker.generation_first_token_observed
    type: histogram
    unit: s
    attributes: generation_stream
    buckets: generation_seconds
    prometheus_name: sie_worker_generation_ttft_seconds
    export: [prometheus, otlp]
  # Worker-side phase boundary for #3136: receipt -> adapter dispatch
  # (validation, model load, chat-template render, admission/capacity wait).
  # Complements ttft (engine grammar preparation + prefill) and tpot (decode)
  # so the client-observed time-to-first-token decomposes by phase per
  # grammar mode.
  - name: sie.worker.generation.worker_wait
    owner: worker_python_engine
    facade_event: worker.generation_worker_wait_observed
    type: histogram
    unit: s
    attributes: generation_stream
    buckets: generation_seconds
    prometheus_name: sie_worker_generation_worker_wait_seconds
    export: [prometheus, otlp]
  - name: sie.worker.generation.tpot
    owner: worker_python_engine
    facade_event: worker.generation_stream_completed
    type: histogram
    unit: s
    attributes: generation_stream
    buckets: generation_seconds
    prometheus_name: sie_worker_generation_tpot_seconds
    export: [prometheus, otlp]
    measurement: generation_tpot
  - name: sie.worker.generation.tokens
    owner: worker_python_engine
    facade_event: worker.generation_stream_completed
    type: counter
    unit: "{token}"
    attributes: generation_tokens
    prometheus_name: sie_worker_generation_tokens_total
    export: [prometheus, otlp]
  - name: sie.worker.generation.inflight
    owner: worker_python_engine
    facade_event: worker.generation_state_changed
    type: gauge
    unit: "{request}"
    attributes: worker_model
    prometheus_name: sie_worker_generation_inflight
    export: [prometheus, otlp]
  - name: sie.worker.generation.kv.reserved
    owner: worker_python_engine
    facade_event: worker.generation_state_changed
    type: gauge
    unit: "{token}"
    attributes: worker_model
    prometheus_name: sie_worker_generation_kv_reserved
    export: [prometheus, otlp]
  - name: sie.worker.generation.kv.budget
    owner: worker_python_engine
    facade_event: worker.generation_state_changed
    type: gauge
    unit: "{token}"
    attributes: worker_model
    prometheus_name: sie_worker_generation_kv_budget
    export: [prometheus, otlp]
  - name: sie.worker.generation.admission.decisions
    owner: worker_python_engine
    facade_event: worker.generation_admission_decided
    type: counter
    unit: "{decision}"
    attributes: generation_admission
    prometheus_name: sie_worker_generation_admission_decisions_total
    export: [prometheus, otlp]
  - name: sie.worker.generation.duplicate_prevented
    owner: worker_python_engine
    facade_event: worker.generation_duplicate_prevented
    type: counter
    unit: "{request}"
    attributes: generation_duplicate
    prometheus_name: sie_worker_generation_duplicate_prevented_total
    export: [prometheus, otlp]
  - name: sie.worker.generation.grammar.compile.duration
    owner: worker_python_engine
    facade_event: worker.generation_grammar_compile_completed
    type: histogram
    unit: s
    attributes: generation_grammar_compile
    buckets: generation_seconds
    prometheus_name: sie_worker_generation_grammar_compile_duration_seconds
    export: [prometheus, otlp]
  - name: sie.worker.generation.grammar.cache.lookups
    owner: worker_python_engine
    facade_event: worker.generation_grammar_cache_lookup
    type: counter
    unit: "{lookup}"
    attributes: generation_grammar_cache
    prometheus_name: sie_worker_generation_grammar_cache_lookups_total
    export: [prometheus, otlp]
  - name: sie.worker.generation.grammar.requests
    owner: worker_python_engine
    facade_event: worker.generation_grammar_requested
    type: counter
    unit: "{request}"
    attributes: generation_grammar
    prometheus_name: sie_worker_generation_grammar_requests_total
    export: [prometheus, otlp]

  # Rust/Candle-specific forward diagnostics share the canonical worker meter
  # but are emitted only by sie-server-rust.
  - name: sie.worker.runtime.forward.duration
    owner: worker_rust_engine
    facade_event: worker.forward_completed
    type: histogram
    unit: s
    attributes: worker_forward
    buckets: worker_request_seconds
    prometheus_name: sie_worker_runtime_forward_duration_seconds
    export: [prometheus, otlp]
  - name: sie.worker.runtime.forward.permit.wait
    owner: worker_rust_engine
    facade_event: worker.forward_permit_released
    type: histogram
    unit: s
    attributes: worker_forward_permit
    buckets: worker_request_seconds
    prometheus_name: sie_worker_runtime_forward_permit_wait_seconds
    export: [prometheus, otlp]
  - name: sie.worker.runtime.forward.concurrent
    owner: worker_rust_engine
    facade_event: worker.forward_activity_changed
    type: up_down_counter
    unit: "{forward}"
    attributes: worker_forward_activity
    prometheus_name: sie_worker_runtime_forward_concurrent
    export: [prometheus, otlp]
  - name: sie.worker.runtime.forward.limit
    owner: worker_rust_engine
    facade_event: worker.forward_activity_changed
    type: gauge
    unit: "{forward}"
    attributes: worker_model
    prometheus_name: sie_worker_runtime_forward_limit
    export: [prometheus, otlp]

  - name: sie.gateway.pool.pinned_model.loaded
    owner: gateway
    facade_event: gateway.pinned_model_state_changed
    type: gauge
    unit: "1"
    measurement: observable_current_snapshot
    removed_lane: emit_zero_once_then_release_from_producer_state
    attributes: gateway_pinned_model
    prometheus_name: sie_gateway_pool_pinned_model_loaded
    # Logical pool names are operator/API-defined and may encode tenant context;
    # keep this pool/model readiness view local rather than exporting it.
    export: [prometheus]

  # KEDA control metrics. Their Prometheus spelling and label set are an API.
  - name: sie.gateway.pending_demand
    owner: gateway
    facade_event: gateway.capacity_state_changed
    type: gauge
    unit: "{request}"
    attributes: keda_lane
    prometheus_name: sie_gateway_pending_demand
    export: [prometheus, otlp]
    topology_availability: [realtime_jetstream, managed_modal]
    keda: pending_demand
  - name: sie.gateway.lane.queue.depth
    owner: gateway
    facade_event: gateway.capacity_state_changed
    type: gauge
    unit: "{item}"
    measurement: jetstream_consumer_num_pending_plus_num_ack_pending_for_exact_physical_lane
    includes: delivered_but_unacknowledged_work_including_progress_acked_model_loading
    excludes: [num_redelivered, num_waiting, worker_direct_streams, dlq_messages, acknowledged_work]
    attributes: keda_lane
    prometheus_name: sie_gateway_lane_queue_depth
    export: [prometheus, otlp]
    topology_availability: [realtime_jetstream]
    managed_modal: omitted_not_applicable_no_durable_queue_authority
    keda: lane_queue_depth
  - name: sie.gateway.lane.queue.snapshot.timestamp
    owner: gateway
    facade_event: gateway.keda_capacity_snapshot
    type: gauge
    unit: s
    value: unix_time_of_broker_reconciliation_start_recorded_after_successful_lane_value
    attributes: keda_lane
    prometheus_name: sie_gateway_lane_queue_snapshot_timestamp_seconds
    # The global control timestamp remains local. This bounded lane companion
    # is also routed remotely only so queue-depth views can reject stale data.
    export: [prometheus, otlp]
    topology_availability: [realtime_jetstream]
    managed_modal: omitted_not_applicable_no_durable_queue_authority
    keda: lane_queue_snapshot_freshness
  - name: sie.gateway.active_lease.gpus
    owner: gateway
    facade_event: gateway.capacity_state_changed
    type: gauge
    unit: "{gpu}"
    attributes: keda_lane
    prometheus_name: sie_gateway_active_lease_gpus
    export: [prometheus, otlp]
    topology_availability: [realtime_jetstream, managed_modal]
    keda: active_lease_gpus
  - name: sie.gateway.pool.warm_floor
    owner: gateway
    facade_event: gateway.capacity_state_changed
    type: gauge
    unit: "{worker}"
    attributes: keda_lane
    prometheus_name: sie_gateway_pool_warm_floor
    export: [prometheus, otlp]
    topology_availability: [realtime_jetstream, managed_modal]
    keda: pool_warm_floor
  - name: sie.gateway.rejected.requests
    owner: gateway
    facade_event: gateway.request_rejected
    type: counter
    unit: "{request}"
    measurement: scale_up_rejections_only
    maximum_series: 4096
    attributes: keda_rejection
    prometheus_name: sie_gateway_rejected_requests_total
    export: [prometheus, otlp]
    keda: scale_worthy_rejection_rate
  - name: sie.gateway.capacity.snapshot.timestamp
    owner: gateway
    facade_event: gateway.keda_capacity_snapshot
    type: gauge
    unit: s
    value: unix_time_of_reconciliation_start_recorded_after_state_values
    attributes: none
    prometheus_name: sie_gateway_capacity_snapshot_timestamp_seconds
    # This is a local autoscaling control signal, not a managed business KPI.
    export: [prometheus]
    keda: capacity_snapshot_freshness

# Collector implementation health does not pass through an application facade,
# but it is still part of the one checked-in operational contract. The managed
# collector's isolated loopback scrape admits only these families before OTLP
# export; it never broad-forwards every version-dependent otelcol self metric.
collector_self_metrics:
  source: prometheus/self
  service_name: sie-otel-collector
  export: [otlp]
  # Prometheus counter exposition adds `_total`; normalize only these exact
  # source aliases back to the stable OTLP family names below.
  prometheus_input_aliases:
    otelcol_receiver_refused_spans_total: otelcol_receiver_refused_spans
    otelcol_exporter_send_failed_spans_total: otelcol_exporter_send_failed_spans
    otelcol_receiver_refused_metric_points_total: otelcol_receiver_refused_metric_points
    otelcol_exporter_send_failed_metric_points_total: otelcol_exporter_send_failed_metric_points
    otelcol_receiver_refused_log_records_total: otelcol_receiver_refused_log_records
    otelcol_exporter_send_failed_log_records_total: otelcol_exporter_send_failed_log_records
  metrics:
    - name: up
      attributes: []
    - name: otelcol_exporter_queue_size
      attributes: [exporter, data_type]
    - name: otelcol_exporter_queue_capacity
      attributes: [exporter, data_type]
    - name: otelcol_receiver_refused_spans
      attributes: [receiver, transport]
    - name: otelcol_exporter_send_failed_spans
      attributes: [exporter, transport]
    - name: otelcol_receiver_refused_metric_points
      attributes: [receiver, transport]
    - name: otelcol_exporter_send_failed_metric_points
      attributes: [exporter, transport]
    - name: otelcol_receiver_refused_log_records
      attributes: [receiver, transport]
    - name: otelcol_exporter_send_failed_log_records
      attributes: [exporter, transport]

logs:
  - event_name: inference.request.completed
    owner: gateway
    facade_event: gateway.request_completed
    body: inference.request.completed
    severity: INFO
    sampling: enclosing_trace_sampled
    attributes:
      event.name: inference.request.completed
      event.schema.version: "2"
      operation: operation
      outcome: request_outcome
      http.status_code: http.status_code
      model: canonical_model_or_other
      machine_profile: canonical_machine_profile
      duration_ms: request_duration_ms
      admission_outcome: bounded_admission_outcome
    correlation: [trace_id, span_id]
    export: [structured_stdout, otlp]

log_processing:
  declared_events_only: true
  accepted_schema_versions: ["1", "2"]
  helm_receiver_binding:
    receiver: gateway
    other_receivers: reject
    service_name: collector_authoritative_sie-gateway
  resource_identity:
    deployment.environment: collector_authoritative
    cloud.region: collector_authoritative
    service.instance.id: producer_process_identity
    service.version: producer_optional

forbidden_metric_attributes:
  - account_id
  - tenant_id
  - organization_id
  - api_key_id
  - request_id
  - session_id
  - job_id
  - work_item_id
  - container_id
  - raw_url
  - error_message
  - exception_message

forbidden_managed_log_fields:
  - authorization
  - api_key
  - api_key_id
  - account_id
  - workos_user_id
  - email
  - prompt
  - document
  - embedding
  - model_output
  - customer_id
  - session_id
  - request_body

rejection_scaling_actions:
  scale_up: [backpressure, no_consumers, publish_ack_failed, upstream_result_timeout]
  non_scale_up_metric_behavior: omit

keda:
  source: prometheus_query_api
  controller_compatibility:
    bundled_app_version: 2.14.1
    v0_6_20_boundary_external_requirement: compatible_with_the_bundled_2_14_1_status_and_hpa_contract_and_watches_the_effective_workload_namespace
  required_exporter: otel_collector_prometheus_exporter
  scrape_target:
    endpoint: "http://<otel-collector-service>:9464/metrics"
    discovery: service_monitor
    consumer: prometheus
  query_api:
    endpoint: "<cluster-prometheus>/api/v1/query"
    consumer: keda_prometheus_scaler
  required_metric_visibility: local_cluster
  application_metrics_export_interval_max_seconds: 5
  prometheus_scrape_interval_max_seconds: 5
  pipeline: application_otlp_to_collector_exposition_to_prometheus_to_keda
  topology_scope:
    realtime_jetstream: all_declared_control_families
    managed_modal: no_prometheus_or_keda_control_path_queue_depth_and_queue_freshness_omitted_other_remote_capacity_state_retained
  ingress_security:
    gateway_receiver: release_gateway_pods_only_on_4317_and_4318
    application_receiver: release_config_and_worker_pods_only_on_4327
    prometheus_exposition: same_namespace_pods_exact_cross_namespace_bundled_prometheus_and_configured_scrape_namespace_names_only_on_9464
    prometheus_scrape_namespace_names_default: []
    bundled_prometheus_cross_namespace_identity: immutable_namespace_name_plus_operator_owned_prometheus_pod_labels
    health_probe_network_policy_ingress: omitted_node_local_kubelet_traffic_unaffected
    enforcement: kubernetes_network_policy_and_distinct_collector_receivers
    namespace_trust_boundary: untrusted_workloads_must_not_have_pod_create_or_label_spoofing_rights_in_the_effective_workload_namespace_global_namespace_or_release_namespace
  readiness_requirements:
    - collector_prometheus_scrape_target_ready
    - gateway_otlp_snapshot_fresh
    - prometheus_target_up
    - prometheus_query_api_ready
  health_gate_enforcement:
    autoscaling_enabled: mandatory_post_install_and_post_upgrade_prometheus_query_and_keda_hpa_hooks_even_when_explicit_health_gates_switch_is_false
    explicit_health_gates: optional_gateway_and_enabled_config_http_smoke_hooks
  application_target_matchers:
    namespace: effective_workload_namespace_added_by_service_monitor
    service: exact_collector_service_added_by_service_monitor
    endpoint: prometheus
    producer_service: sie-gateway_authored_by_trusted_collector_receiver
  forward_migration_query_boundary:
    source: v0_6_20_objects_use_their_historical_queries_until_target_apply
    target: canonical_collector_freshness_gated_queries_only
    overlap_bridge: none
    producer_behavior: no_legacy_alias_and_no_duplicate_emission
    cutover: standard_apply_updates_the_same_scaledobject_identities_in_place
  prometheus_target_identity:
    honor_labels: false
    authority: service_monitor_target_labels
    producer_service_source: trusted_collector_receiver
    producer_instance_source: sanitized_service_instance_id
    collector_generation_source: procfs_uuid_read_once_per_collector_process_config_load
    service_monitor_exported_label_copy: forbidden
  collector_readiness_guard: 'max(up{namespace="{{ namespace }}", service="{{ collector_service }}", endpoint="prometheus"}) == 1'
  capacity_snapshot_freshness_max_seconds: 20

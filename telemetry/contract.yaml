histogram_buckets:
  gateway_request_seconds: [0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.025, 0.03, 0.04, 0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1.0, 2.0, 5.0, 10.0, 30.0, 60.0]
  gateway_queue_publish_seconds: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0]
  gateway_queue_publish_items: [1, 5, 9, 13, 17, 21, 25, 29, 33, 37, 41, 45, 49, 53, 57, 61]
  gateway_queue_result_wait_seconds: [0.01, 0.025, 0.05, 0.1, 0.2, 0.3, 0.5, 0.75, 1.0, 2.0, 5.0, 10.0, 30.0]
  # Shares gateway_request_seconds' boundaries below 1.0 so the confirm's share
  # of buffered response latency is readable off the two histograms directly.
  # The 20.0 boundary is the documented worst case: four attempts under a
  # five-second client timeout each.
  gateway_settlement_confirm_seconds: [0.0005, 0.001, 0.002, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.0, 5.0, 10.0, 20.0, 30.0]
  dispatcher_invocation_seconds: [0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 120.0]
  # Sealed staging is fetch + seal + first model load, NOT a request: the measured
  # cold start is ~130 s, so the interesting resolution is tens-to-hundreds of
  # seconds. Reusing dispatcher_invocation_seconds would pile every real staging
  # into its 120 s overflow bucket and measure nothing.
  dispatcher_sealed_stage_seconds: [1.0, 5.0, 10.0, 30.0, 60.0, 120.0, 180.0, 300.0, 450.0, 600.0, 900.0]
  config_request_seconds: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0]
  worker_queue_seconds: [0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0]
  # Transport-queue age spans far past the scheduler-local 30s ceiling. The
  # upper boundaries are the system's own constants — 120s client ceiling, 300s
  # generation ack wait, 600s redelivery envelope, 1800s stream retention — so
  # "executed after its client gave up" is a bucket count, not an interpolation.
  worker_work_item_age_seconds: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 120.0, 300.0, 600.0, 1800.0]
  worker_request_seconds: [0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 120.0, 300.0]
  worker_model_load_seconds: [0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 120.0, 300.0, 600.0, 900.0]
  worker_ipc_seconds: [0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 300.0, 900.0]
  worker_batch_items: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
  worker_batch_cost: [128, 512, 1024, 2048, 4096, 8192, 16384, 32768, 65536, 131072, 262144]
  worker_pending_items: [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
  generation_seconds: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0, 30.0, 60.0, 120.0, 300.0]
  worker_delivery_attempts: [1, 2, 3, 5, 10]
  worker_payload_bytes: [256, 1024, 4096, 16384, 65536, 262144, 1048576, 4194304, 16777216, 67108864]
  worker_transport_bytes: [256, 1024, 4096, 16384, 65536, 262144, 1048576, 4194304, 16777216, 67108864]
  worker_chunk_count: [1, 2, 4, 8, 16, 32, 64]
  worker_ipc_acquire_seconds: [0.000001, 0.00001, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0]

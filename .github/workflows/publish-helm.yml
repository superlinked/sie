name: Publish Helm

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      sha:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: >-
      inputs.publish == true &&
      vars.PUBLIC_RELEASE_PUBLISHING_ENABLED == 'true' &&
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false &&
      github.ref_protected == true &&
      github.ref == format('refs/tags/{0}', inputs.tag_name) &&
      github.repository == 'superlinked/sie' &&
      github.sha == inputs.sha
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: helm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Validate trusted publication context and tag binding
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_SHA: ${{ inputs.sha }}
          PUBLIC_RELEASE_PUBLISHING_ENABLED: ${{ vars.PUBLIC_RELEASE_PUBLISHING_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/ci/release_guard.py publish --source-ref "$RELEASE_SHA"
          --version "$RELEASE_VERSION" --tag-name "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helm-sie-cluster-${{ inputs.version }}
          path: artifact
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.5.5
          install_args: --jobs=1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and verify the same chart bytes without replacing a version
        run: >-
          mise exec -- python -m tools.ci.publish_helm_archive
          --directory artifact --version '${{ inputs.version }}'
          --source-revision '${{ inputs.sha }}' --run-id '${{ github.run_id }}'

  complete:
    if: always() && inputs.publish
    needs: publish
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require release publication to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; results=json.loads(os.environ["RESULTS"]); failed={name: job["result"] for name,job in results.items() if job["result"] != "success"}; print(failed); assert not failed'

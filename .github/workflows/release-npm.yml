name: Build npm distributions

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      version:
        type: string
        default: ''
      tag_name:
        type: string
        default: ''
      build_only:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: bash tools/ci/mise_binary.bash
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.5.5
          # Install everything here; later mise exec would auto-install omitted tools.
          install_args: --jobs=1
      - name: Validate source and optional release identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          set -euo pipefail
          if [ "$BUILD_ONLY" = true ]; then
            mise exec -- python tools/ci/release_guard.py build --source-ref "$SOURCE_REF"
          else
            test -n "$RELEASE_VERSION"
            mise exec -- python tools/ci/release_guard.py build --source-ref "$SOURCE_REF" --version "$RELEASE_VERSION" --tag-name "$RELEASE_TAG"
          fi
      # Pull-request builds reuse the installed pnpm workspace; release builds
      # start from an empty tree.
      - name: Restore the pnpm workspace
        if: inputs.build_only == true
        id: pnpm-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            integrations/*/node_modules
            examples/*/*/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'mise.toml') }}
      # On release builds the restore step is skipped and its output is empty,
      # which this condition counts as a miss on purpose.
      - name: Provide libvips so sharp builds instead of downloading it
        if: steps.pnpm-modules.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libvips-dev
      - name: Build complete archives and test clean packed consumers
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: mise exec -- python tools/ci/distributions.py build npm --directory artifacts --version "$RELEASE_VERSION"
      - name: Bind tested release bytes to the original run
        if: inputs.build_only == false
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          mise exec -- python -m tools.ci.release_artifact stamp --directory artifacts --kind npm --version "$RELEASE_VERSION" --tag-name "$RELEASE_TAG" --source-revision "$SOURCE_REF" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-distributions
          path: artifacts/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 30 || 5 }}

name: Build release Docker artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      server: ${{ steps.resolve.outputs.server }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.5.5
          install_args: --jobs=1
      - id: resolve
        name: Validate source closure and coordinated versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          matrix="$(mise run docker -- matrix --version "$RELEASE_VERSION")"
          echo "server=$(jq -c . <<<"$matrix")" >> "$GITHUB_OUTPUT"

  build-server:
    needs: matrix
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.server) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.5.5
          install_args: --jobs=1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: restore
        name: Reuse an already retained original-run image on retry
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m tools.ci.restore_release_artifact
          --directory artifact --name 'docker-server-${{ matrix.platform }}-${{ matrix.bundle }}-${{ inputs.version }}'
          --kind docker --version '${{ inputs.version }}' --tag-name '${{ inputs.tag_name }}'
          --source-revision '${{ inputs.sha }}' --run-id '${{ github.run_id }}'
      - name: Build once, smoke the loaded image, and save those bytes
        if: steps.restore.outputs.restored != 'true'
        run: >-
          mise run docker -- build-server
          --registry ghcr.io/superlinked --version '${{ inputs.version }}'
          --platform '${{ matrix.platform }}' --bundle '${{ matrix.bundle }}'
          --source-revision '${{ inputs.sha }}'
          --run-id '${{ github.run_id }}' --archive-dir artifact --evidence-dir evidence
      - if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-server-${{ matrix.platform }}-${{ matrix.bundle }}-${{ inputs.version }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - id: restore-evidence
        name: Reuse original image verification evidence on retry
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m tools.ci.restore_release_artifact
          --directory retained-evidence --evidence-of artifact
          --name 'docker-evidence-server-${{ matrix.platform }}-${{ matrix.bundle }}-${{ inputs.version }}'
          --kind docker --version '${{ inputs.version }}' --tag-name '${{ inputs.tag_name }}'
          --source-revision '${{ inputs.sha }}' --run-id '${{ github.run_id }}'
      - name: Derive verification evidence from the retained archive
        if: steps.restore-evidence.outputs.restored != 'true'
        run: |
          mkdir -p evidence
          cp artifact/provenance.json evidence/provenance.json
      - if: steps.restore-evidence.outputs.restored != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-evidence-server-${{ matrix.platform }}-${{ matrix.bundle }}-${{ inputs.version }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  build-service:
    needs: matrix
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        service: [sie-gateway, sie-config, sie-mcp, sie-server-sidecar, sie-server-rust]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.5.5
          install_args: --jobs=1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: restore
        name: Reuse an already retained original-run image on retry
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m tools.ci.restore_release_artifact
          --directory artifact --name 'docker-service-${{ matrix.service }}-${{ inputs.version }}'
          --kind docker --version '${{ inputs.version }}' --tag-name '${{ inputs.tag_name }}'
          --source-revision '${{ inputs.sha }}' --run-id '${{ github.run_id }}'
      - name: Build once, smoke the loaded image, and save those bytes
        if: steps.restore.outputs.restored != 'true'
        run: >-
          mise run docker -- build-service
          --registry ghcr.io/superlinked --version '${{ inputs.version }}'
          --service '${{ matrix.service }}'
          --source-revision '${{ inputs.sha }}'
          --run-id '${{ github.run_id }}' --archive-dir artifact --evidence-dir evidence
      - if: steps.restore.outputs.restored != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-service-${{ matrix.service }}-${{ inputs.version }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - id: restore-evidence
        name: Reuse original image verification evidence on retry
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m tools.ci.restore_release_artifact
          --directory retained-evidence --evidence-of artifact
          --name 'docker-evidence-service-${{ matrix.service }}-${{ inputs.version }}'
          --kind docker --version '${{ inputs.version }}' --tag-name '${{ inputs.tag_name }}'
          --source-revision '${{ inputs.sha }}' --run-id '${{ github.run_id }}'
      - name: Derive verification evidence from the retained archive
        if: steps.restore-evidence.outputs.restored != 'true'
        run: |
          mkdir -p evidence
          cp artifact/provenance.json evidence/provenance.json
      - if: steps.restore-evidence.outputs.restored != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-evidence-service-${{ matrix.service }}-${{ inputs.version }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

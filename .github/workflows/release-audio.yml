name: Release native audio asset

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      sha:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64@sha256:4dc41da7df20400310c80d162a2fe2d2c2f3d9734d8dec20f6b9843711618deb
    timeout-minutes: 30
    outputs:
      filename: ${{ steps.contract.outputs.filename }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: false
          cache: false
      - name: Install pinned native build tools
        run: |
          mise trust
          mise install python uv zig
      - id: contract
        name: Validate exact release identity and asset filename
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          filename="$(mise exec -- python -c 'import runpy; print(runpy.run_path("packages/sie_audio_prep/build_wheel.py")["AUDIO_WHEEL_FILENAME"])')"
          test "$filename" = "sie_audio_prep-$RELEASE_VERSION-cp312-abi3-manylinux_2_28_x86_64.whl"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
      - name: Build and validate exact Linux wheel
        run: mise exec -- python tools/ci/build_audio_prep_release_asset.py --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audio-prep-${{ inputs.version }}
          path: dist/${{ steps.contract.outputs.filename }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: >-
      inputs.publish == true &&
      vars.PUBLIC_RELEASE_PUBLISHING_ENABLED == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.repository == 'superlinked/sie' &&
      github.sha == inputs.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate trusted publication context and tag binding
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = superlinked/sie
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audio-prep-${{ inputs.version }}
          path: artifact
      - name: Attach and verify exact GitHub Release asset
        env:
          AUDIO_WHEEL_FILENAME: ${{ needs.build.outputs.filename }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          wheel="artifact/$AUDIO_WHEEL_FILENAME"
          test -f "$wheel"
          python3 -c 'import runpy,sys; runpy.run_path("packages/sie_audio_prep/build_wheel.py")["_validate_wheel"](__import__("pathlib").Path(sys.argv[1]))' "$wheel"
          gh release upload "$RELEASE_TAG" "$wheel#$AUDIO_WHEEL_FILENAME" --clobber
          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$AUDIO_WHEEL_FILENAME"
          actual_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$AUDIO_WHEEL_FILENAME\") | .browser_download_url")"
          test "$actual_url" = "$expected_url"

name: Release native sidecar asset

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag_name:
        required: true
        type: string
      sha:
        required: true
        type: string
      publish:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-service-sie-server-sidecar-${{ inputs.version }}
          path: image-artifact
      - name: Extract and validate the binary from the same tested image
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          mise exec -- uv run --frozen --project . python -m tools.ci.build_sidecar_release_asset \
            --directory image-artifact --out artifact --version "$RELEASE_VERSION" \
            --source-revision "$RELEASE_SHA" --run-id '${{ github.run_id }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sidecar-${{ inputs.version }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: >-
      inputs.publish == true &&
      vars.PUBLIC_RELEASE_PUBLISHING_ENABLED == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.repository == 'superlinked/sie' &&
      github.sha == inputs.sha
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Validate trusted publication context and tag binding
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_LATCH: ${{ vars.PUBLIC_RELEASE_PUBLISHING_ENABLED }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$REF_PROTECTED" = true
          test "$RELEASE_LATCH" = true
          test "$GITHUB_REPOSITORY" = superlinked/sie
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python3 -c 'import os,re; v=os.environ["RELEASE_VERSION"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); assert tuple(map(int,v.split("."))) > (0,7,3)'
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-sidecar-${{ inputs.version }}
          path: artifact
      - name: Revalidate and attach only missing or byte-identical sidecar assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag_name }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 -m tools.ci.release_artifact check --directory artifact --kind native-sidecar --version '${{ inputs.version }}' --tag-name '${{ inputs.tag_name }}' --source-revision '${{ inputs.sha }}' --run-id '${{ github.run_id }}'
          binary="sie-server-sidecar-v$RELEASE_VERSION-linux-amd64"
          for filename in "$binary" "$binary.sha256" "$binary.json"; do
            RELEASE_ASSET_FILENAME="$filename" bash tools/ci/upload_native_release_asset.bash "artifact/$filename"
          done

  complete:
    if: always() && inputs.publish
    needs: [build, publish]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every release build and publisher to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; results=json.loads(os.environ["RESULTS"]); failed={name: job["result"] for name,job in results.items() if job["result"] != "success"}; print(failed); assert not failed'

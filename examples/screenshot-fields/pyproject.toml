[project]
name = "superlinked-sie-screenshot-fields-example"
version = "0.1.0"
description = "Read a full application screenshot into typed fields and verify the recorded answer"
requires-python = ">=3.12,<3.13"
dependencies = ["sie-sdk==0.10.1", "jsonschema==4.25.1"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.14"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

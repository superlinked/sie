[project]
name = "superlinked-sie-document-to-markdown-olmocr-example"
version = "0.1.0"
description = "Turn PDF pages into Markdown with SIE's LightOnOCR-2-1B, scored on Ai2's olmOCR-Bench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sie-sdk>=0.6.23,<0.9.0",
  "pypdfium2>=4.30",
  "huggingface-hub>=0.24",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

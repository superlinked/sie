[project]
name = "superlinked-sie-ocr-glm-example"
version = "0.1.0"
description = "Self-host GLM-OCR and reproduce the recorded receipt and handwriting comparison"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sie-sdk>=0.9.0,<1",
  "numpy>=2,<3",
  "pillow==12.2.0",
]

[project.optional-dependencies]
recorded = ["datasets==3.6.0", "huggingface-hub>=1.3,<2", "transformers==5.3.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

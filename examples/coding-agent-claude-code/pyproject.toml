[project]
name = "superlinked-sie-coding-agent-claude-code-example"
version = "0.1.0"
description = "Claude Code recipes and a seeded gate for SIE's Anthropic Messages endpoint"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

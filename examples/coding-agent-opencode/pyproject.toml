[project]
name = "superlinked-sie-coding-agent-opencode-example"
version = "0.1.0"
description = "Agent-loop conformance check and OpenCode recipes for SIE"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

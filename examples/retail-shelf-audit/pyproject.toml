[project]
name = "retail-shelf-audit"
version = "0.1.0"
description = "Turn a shelf gap, an out-of-stock notice, and a price label into grounded shelf-audit evidence with SIE"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "sie-sdk>=0.6.23",
]

[project.scripts]
audit-retail-shelf = "retail_shelf_audit.audit:main"
verify-retail-records = "retail_shelf_audit.verify:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retail_shelf_audit"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

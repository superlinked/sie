[project]
name = "superlinked-sie-image-search-example"
version = "0.1.0"
description = "Find the product photo a shopper describes: SIE SigLIP so400m against Voyage, Cohere and GPT captions on a held-out Amazon Berkeley Objects catalogue"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sie-sdk>=0.6.23,<0.8.0",
  "numpy>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[project]
name = "watermark-robustness"
version = "0.1.0"
description = "Measure how much of an LLM text watermark survives translation and paraphrase run through SIE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.57,<6",
    "sacrebleu>=2.4",
    "sentence-transformers>=3.0",
    "sie-sdk>=0.7.3",
]

[tool.uv]
package = false

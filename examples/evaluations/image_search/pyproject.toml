[project]
name = "superlinked-sie-image-retrieval-evaluation"
version = "0.1.0"
description = "Verify a pinned image retrieval pilot and rerun its native SIE requests"
requires-python = ">=3.12,<3.13"
dependencies = ["sie-sdk>=0.8.3,<0.9.0"]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 120
target-version = "py312"

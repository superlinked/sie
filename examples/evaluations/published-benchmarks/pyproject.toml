[project]
name = "superlinked-sie-published-benchmarks-example"
version = "0.1.0"
description = "Repeat the method behind the published SIE benchmark numbers, or test a new model the same way, from one client process"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sie-sdk>=0.10.1,<0.11",
    "datasets>=3.6,<5",
    "pytrec-eval-terrier>=0.5.6,<0.6",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 120
target-version = "py312"

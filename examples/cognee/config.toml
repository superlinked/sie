[models]
llm = "Qwen/Qwen3.5-4B"
embedding = "BAAI/bge-m3"
embedding_dimensions = 1024
ocr = "lightonai/LightOnOCR-2-1B"
rerank = "Qwen/Qwen3-Reranker-0.6B"
decision = "fastino/GLiNER2.5-Decide"

[limits]
retrieve_top_k = 5
rerank_top_k = 3
# Character budget is a conservative client guard, not an exact token count.
# The server still enforces overflow_policy=error for its combined context.
evidence_chars = 1000
request_timeout_seconds = 90
provision_timeout_seconds = 180
experiment_timeout_seconds = 600
document_bytes = 10000000
document_pages = 3
page_pixels = 12000000
pdf_scale = 1.5
distill_batches = 1

[decision]
instructions = "Recommend an illustrative workshop action from the supplied evidence and applicable readiness policy. Use review if a required check is absent or contradictory. A model score is not proof."
query = "May the workshop on 2026-11-14 proceed under the readiness policy?"
new_query = "May a new workshop on 2026-11-21 proceed? Its projector and microphone passed, but step-free access is unconfirmed. Apply the readiness policy."

[decision.choices]
proceed = "All checks required by the applicable policy are explicitly confirmed."
review = "At least one required check is missing, uncertain or contradictory."

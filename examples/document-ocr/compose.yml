services:
  sie:
    # CPU default bundle includes donut, gliner, and paddleocr_vl. Preload
    # Donut, GLiNER, and PaddleOCR-VL-1.5:transformers so recognition,
    # structured extraction, and NER all come from this image. LightOnOCR and
    # GLM-OCR use sglang_vision_extract — see compose.gpu.yml.
    image: ghcr.io/superlinked/sie-server:latest-cpu-default
    # linux/amd64 is a no-op on x86_64 Linux hosts; on Apple Silicon it forces
    # Rosetta translation (slower but works for local testing).
    platform: linux/amd64
    command:
      - serve
      - --port
      - "8080"
      - --preload
      - naver-clova-ix/donut-base-finetuned-cord-v2,naver-clova-ix/donut-base-finetuned-docvqa,urchade/gliner_multi-v2.1,PaddlePaddle/PaddleOCR-VL-1.5:transformers
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 90
      start_period: 240s
    volumes:
      # SIE's image sets HF_HOME=/app/.cache/huggingface; mount the volume
      # there so the model weights survive `docker compose down/up`.
      - sie-cache:/app/.cache/huggingface

volumes:
  sie-cache:
    name: sie-cache
    external: false

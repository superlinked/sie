services:
  sie:
    # CPU compose uses the default bundle. That bundle includes the donut and
    # gliner adapters, so the preloaded Donut and GLiNER models load here.
    # LightOnOCR, GLM-OCR, and PaddleOCR-VL default to sglang_vision_extract,
    # which this image does not ship — use compose.gpu.yml for those.
    image: ghcr.io/superlinked/sie-server:latest-cpu-default
    # linux/amd64 is a no-op on x86_64 Linux hosts; on Apple Silicon it forces
    # Rosetta translation (slower but works for local testing).
    platform: linux/amd64
    command:
      - serve
      - --port
      - "8080"
      - --preload
      - naver-clova-ix/donut-base-finetuned-cord-v2,naver-clova-ix/donut-base-finetuned-docvqa,urchade/gliner_multi-v2.1
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 90
      start_period: 240s
    volumes:
      # SIE's image sets HF_HOME=/app/.cache/huggingface; mount the volume
      # there so the model weights survive `docker compose down/up`.
      - sie-cache:/app/.cache/huggingface

volumes:
  sie-cache:
    name: sie-cache
    external: false

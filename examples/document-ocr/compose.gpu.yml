services:
  sie:
    # GPU compose uses the sglang-vision-extract bundle. The default profile
    # of LightOnOCR-2-1B, GLM-OCR, and PaddleOCR-VL-1.5 is sglang_vision_extract,
    # which is the only adapter this image ships. Donut and GLiNER are not in
    # this bundle — use compose.yml for those.
    # Preload only LightOnOCR-2-1B, the recognition default. GLM-OCR and
    # PaddleOCR-VL-1.5 stay selectable in the UI and load on demand. They are
    # not preloaded together because they do not fit on one GPU with LightOnOCR.
    image: ghcr.io/superlinked/sie-server:latest-cuda12-sglang-vision-extract
    command:
      - serve
      - --port
      - "8080"
      - --preload
      - lightonai/LightOnOCR-2-1B
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 360s
    volumes:
      - sie-cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  sie-cache:
    name: sie-cache
    external: false

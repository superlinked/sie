services:
  sie:
    # GPU compose uses the sglang-vision-extract bundle. LightOnOCR-2-1B and
    # GLM-OCR use that adapter. Donut, GLiNER, and PaddleOCR-VL's transformers
    # profile are not in this bundle — use compose.yml for those.
    # Preload only LightOnOCR-2-1B. GLM-OCR stays selectable and loads on
    # demand; it is not preloaded with LightOnOCR because the two do not fit
    # on one GPU.
    image: ghcr.io/superlinked/sie-server:latest-cuda12-sglang-vision-extract
    command:
      - serve
      - --port
      - "8080"
      - --preload
      - lightonai/LightOnOCR-2-1B
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 360s
    volumes:
      - sie-cache:/app/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  sie-cache:
    name: sie-cache
    external: false

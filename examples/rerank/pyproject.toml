[project]
name = "superlinked-sie-rerank-example"
version = "0.1.0"
description = "Rank exact primary-source passages with public SIE"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sie-sdk>=0.6.19,<0.7.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

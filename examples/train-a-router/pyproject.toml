[project]
name = "train-a-router"
version = "0.1.0"
description = "Outcome-supervised routing on family-separated BBEH problems"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.4.6"]

[tool.uv]
package = false

[tool.uv.sources]
sie-sdk = { git = "https://github.com/superlinked/sie.git", rev = "975d5309ba3af9eaeb13725b20dcf10d906c3e2a", subdirectory = "packages/sie_sdk" }

[dependency-groups]
outcomes = ["scipy==1.17.0", "scikit-learn==1.6.1"]
collection = ["httpx==0.28.1"]
encode = ["sie-sdk==0.10.1", "httpx==0.28.1", "transformers==4.57.6", "huggingface-hub==0.36.0"]
training = ["laya==0.3.29", "peft==0.18.1", "torch==2.9.1", "transformers==4.57.6"]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Preserve the exact scheduler bytes bound by acquisition receipts.
"openai_population.py" = ["F401"]

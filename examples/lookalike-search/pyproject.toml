[project]
name = "superlinked-sie-lookalike-search-example"
version = "0.1.0"
description = "Find the passage that answers a question when a look-alike rule sits beside it: SIE Qwen3 Embedding 4B against hosted embedding APIs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sie-sdk>=0.6.23,<0.8.0",
  "numpy>=2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

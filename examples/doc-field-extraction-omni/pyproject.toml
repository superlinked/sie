[project]
name = "superlinked-sie-doc-field-extraction-omni-example"
version = "0.1.0"
description = "Read Omni OCR Benchmark documents into their own JSON schema with SIE, and grade the replies with Omni's JSON accuracy"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sie-sdk>=0.9.0",
  # The published pilot re-encoded one page; Pillow 12.2.0 reproduces its bytes exactly.
  "pillow==12.2.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

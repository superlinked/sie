[project]
name = "superlinked-sie-visual-document-search-example"
version = "0.1.0"
description = "Rank document pages by what they look like with SIE and ColPali"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sie-sdk>=0.6.23,<0.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[project]
name = "maintenance-triage-agent"
version = "0.1.0"
description = "Reconstruct the NTSB East Palestine bearing-detector sequence with SIE"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "sie-sdk==0.7.1",
]

[project.scripts]
triage-fault = "maintenance_triage.review:main"
eval-triage = "maintenance_triage.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maintenance_triage"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
